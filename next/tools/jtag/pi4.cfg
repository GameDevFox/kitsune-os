# OpenOCD config for debugging the Raspberry Pi 4 through a J-Link.
# The SD card's config.txt needs enable_jtag_gpio=1.
#
#   openocd -f tools/jtag/pi4.cfg

source [find interface/jlink.cfg]
transport select jtag
source [find target/bcm2711.cfg]

# After the target config, which sets its own speed. 12 MHz worked and 20 MHz
# failed on jumper wires, so this leaves a margin.
adapter speed 8000

# Otherwise the kernel stays halted when GDB detaches, which looks like a hang.
bcm2711.cpu0 configure -event gdb-detach { resume }
